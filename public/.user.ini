; PHP upload limits for PHP-FPM environments (Nginx / Apache + PHP-FPM)
;
; NOTE: if this app runs behind Nginx (proxying to PHP-FPM), these values
; alone are NOT enough for large uploads. Nginx enforces its own limits
; before a request ever reaches PHP:
;   client_max_body_size 100m;
;   proxy_read_timeout 600s;      (or fastcgi_read_timeout 600s;)
;   client_body_timeout 600s;
; Add those to the server/location block for this site, then reload Nginx.
; Without them, large uploads can fail with a 413 or time out even though
; PHP itself is configured correctly here.
upload_max_filesize = 100M
post_max_size = 105M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
